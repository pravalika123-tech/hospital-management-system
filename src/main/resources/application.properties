spring.application.name=hospital-management-system
server.port=8080

# MongoDB connection. Override with the MONGODB_URI environment variable in production.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/hospitaldb}
spring.data.mongodb.auto-index-creation=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# JWT (demo secret - override JWT_SECRET in real deployments)
hospital.jwt.secret=${JWT_SECRET:3dGEQHhNOlIQeQjrKQLLc5JW8qcb9eI387SbJxr/kDNHl1hhGQVJaa0iRHATfywv0823lhCfe6V7za9j6LqbhQ==}
hospital.jwt.expiration-ms=86400000

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
