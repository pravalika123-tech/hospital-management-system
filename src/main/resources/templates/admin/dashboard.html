<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Admin Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container py-4">
    <h2 class="fw-bold mb-4">Admin Dashboard</h2>
    <div class="row g-3 mb-4">
        <div class="col-md-3"><div class="card text-center"><div class="card-body"><h6 class="text-muted">Doctors</h6><h2 th:text="${doctorCount}">0</h2></div></div></div>
        <div class="col-md-3"><div class="card text-center"><div class="card-body"><h6 class="text-muted">Patients</h6><h2 th:text="${patientCount}">0</h2></div></div></div>
        <div class="col-md-3"><div class="card text-center"><div class="card-body"><h6 class="text-muted">Appointments</h6><h2 th:text="${appointmentCount}">0</h2></div></div></div>
        <div class="col-md-3"><div class="card text-center"><div class="card-body"><h6 class="text-muted">Medical records</h6><h2 th:text="${recordCount}">0</h2></div></div></div>
    </div>
    <div class="d-flex gap-2 mb-4">
        <a th:href="@{/admin/doctors}" class="btn btn-primary">Manage doctors</a>
        <a th:href="@{/admin/patients}" class="btn btn-outline-primary">View patients</a>
        <a th:href="@{/admin/appointments}" class="btn btn-outline-primary">All appointments</a>
    </div>
    <div class="card">
        <div class="card-header fw-bold">Pending approval</div>
        <div class="card-body">
            <table class="table table-sm table-hover">
                <thead><tr><th>Patient</th><th>Doctor</th><th>Date &amp; time</th><th>Reason</th></tr></thead>
                <tbody>
                <tr th:each="a : ${pending}">
                    <td th:text="${a.patientName}"></td><td th:text="${a.doctorName}"></td>
                    <td th:text="${a.dateTime}"></td><td th:text="${a.reason}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(pending)}"><td colspan="4" class="text-muted">No pending appointments.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
