<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Add Doctor</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container py-4" style="max-width: 720px;">
    <h2 class="fw-bold mb-4">Add Doctor</h2>
    <div class="card"><div class="card-body">
        <form th:action="@{/admin/doctors}" th:object="${doctor}" method="post">
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label">Name</label><input class="form-control" th:field="*{name}" required></div>
                <div class="col-md-6"><label class="form-label">Specialization</label><input class="form-control" th:field="*{specialization}" required></div>
                <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" th:field="*{email}" required></div>
                <div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" th:field="*{phone}"></div>
                <div class="col-md-6"><label class="form-label">Experience (years)</label><input type="number" class="form-control" th:field="*{experienceYears}" value="0"></div>
                <div class="col-md-6"><label class="form-label">Consultation fee</label><input type="number" step="0.01" class="form-control" th:field="*{consultationFee}" value="0"></div>
                <div class="col-12 form-check"><input type="checkbox" class="form-check-input" th:field="*{available}" checked><label class="form-check-label">Available for appointments</label></div>
            </div>
            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save doctor</button>
                <a th:href="@{/admin/doctors}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div></div>
</div>
</body>
</html>
