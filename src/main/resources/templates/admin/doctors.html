<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Doctors</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold">Doctors</h2>
        <a th:href="@{/admin/doctors/new}" class="btn btn-primary">+ Add doctor</a>
    </div>
    <div class="card">
        <table class="table table-hover mb-0">
            <thead class="table-light"><tr><th>Name</th><th>Specialization</th><th>Email</th><th>Experience</th><th>Fee</th><th>Available</th><th></th></tr></thead>
            <tbody>
            <tr th:each="d : ${doctors}">
                <td th:text="${d.name}"></td><td th:text="${d.specialization}"></td>
                <td th:text="${d.email}"></td>
                <td th:text="${d.experienceYears} + ' yrs'"></td>
                <td th:text="'₹' + ${d.consultationFee}"></td>
                <td><span class="badge" th:classappend="${d.available} ? ' bg-success' : ' bg-secondary'" th:text="${d.available} ? 'Yes' : 'No'"></span></td>
                <td><a th:href="@{/admin/doctors/delete/{id}(id=${d.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this doctor?')">Delete</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(doctors)}"><td colspan="7" class="text-muted">No doctors yet.</td></tr>
            </tbody>
        </table>
    </div>
    <a th:href="@{/admin/dashboard}" class="btn btn-link mt-3">&larr; Back to dashboard</a>
</div>
</body>
</html>
