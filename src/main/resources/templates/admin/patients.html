<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Patients</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container py-4">
    <h2 class="fw-bold mb-4">Patients</h2>
    <div class="card"><table class="table table-hover mb-0">
        <thead class="table-light"><tr><th>Name</th><th>Username</th><th>Email</th><th>Phone</th><th>Date of birth</th><th>Address</th></tr></thead>
        <tbody>
        <tr th:each="p : ${patients}">
            <td th:text="${p.name}"></td><td th:text="${p.username}"></td><td th:text="${p.email}"></td>
            <td th:text="${p.phone}"></td><td th:text="${p.dateOfBirth}"></td><td th:text="${p.address}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(patients)}"><td colspan="6" class="text-muted">No patients yet.</td></tr>
        </tbody>
    </table></div>
    <a th:href="@{/admin/dashboard}" class="btn btn-link mt-3">&larr; Back to dashboard</a>
</div>
</body>
</html>
