<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Doctor Appointments</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container py-4">
    <h2 class="fw-bold mb-4">My Appointments</h2>
    <div class="card"><table class="table table-hover mb-0">
        <thead class="table-light"><tr><th>Patient</th><th>Date &amp; time</th><th>Reason</th><th>Status</th><th>Update</th></tr></thead>
        <tbody>
        <tr th:each="a : ${appointments}">
            <td th:text="${a.patientName}"></td><td th:text="${a.dateTime}"></td><td th:text="${a.reason}"></td>
            <td><span class="badge bg-info text-dark" th:text="${a.status}"></span></td>
            <td>
                <form th:action="@{/doctor/appointments/{id}/status(id=${a.id})}" method="post" class="d-flex gap-1">
                    <select name="status" class="form-select form-select-sm">
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == a.status}"></option>
                    </select>
                    <button class="btn btn-sm btn-primary">Save</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(appointments)}"><td colspan="5" class="text-muted">No appointments assigned.</td></tr>
        </tbody>
    </table></div>
    <a th:href="@{/doctor/dashboard}" class="btn btn-link mt-3">&larr; Back to dashboard</a>
</div>
</body>
</html>
