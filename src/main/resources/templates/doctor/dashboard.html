<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Doctor Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container py-4">
    <h2 class="fw-bold">Welcome, <span th:text="${doctor.name}">Doctor</span></h2>
    <p class="text-muted" th:text="${doctor.specialization} + ' | ' + ${doctor.experienceYears} + ' years experience'"></p>
    <div class="d-flex gap-2 mb-4">
        <a th:href="@{/doctor/appointments}" class="btn btn-primary">My appointments</a>
        <a th:href="@{/doctor/records}" class="btn btn-outline-primary">Medical records</a>
    </div>
    <div class="card">
        <div class="card-header fw-bold">Upcoming appointments</div>
        <div class="card-body"><table class="table table-sm mb-0">
            <thead><tr><th>Patient</th><th>Date &amp; time</th><th>Reason</th><th>Status</th></tr></thead>
            <tbody>
            <tr th:each="a : ${appointments}">
                <td th:text="${a.patientName}"></td><td th:text="${a.dateTime}"></td>
                <td th:text="${a.reason}"></td><td th:text="${a.status}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(appointments)}"><td colspan="4" class="text-muted">No appointments assigned.</td></tr>
            </tbody>
        </table></div>
    </div>
</div>
</body>
</html>
