<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Add Medical Record</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container py-4" style="max-width: 720px;">
    <h2 class="fw-bold mb-4">Add Medical Record</h2>
    <div class="card"><div class="card-body">
        <form th:action="@{/doctor/records}" th:object="${record}" method="post">
            <div class="mb-3">
                <label class="form-label">Patient</label>
                <select class="form-select" th:field="*{patientId}" required>
                    <option value="">-- Select patient --</option>
                    <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.name}"
                            th:selected="${p.id == selectedPatientId}"></option>
                </select>
            </div>
            <div class="mb-3"><label class="form-label">Diagnosis</label><input class="form-control" th:field="*{diagnosis}" required></div>
            <div class="mb-3"><label class="form-label">Prescription</label><textarea class="form-control" rows="3" th:field="*{prescription}"></textarea></div>
            <div class="mb-3"><label class="form-label">Notes</label><textarea class="form-control" rows="2" th:field="*{notes}"></textarea></div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save record</button>
                <a th:href="@{/doctor/records}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div></div>
</div>
</body>
</html>
