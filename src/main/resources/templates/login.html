<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - CarePlus Hospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 480px;">
    <div class="card shadow-sm mt-5">
        <div class="card-body p-4">
            <h2 class="text-center text-primary fw-bold mb-1">CarePlus Hospital</h2>
            <p class="text-center text-muted mb-4">Hospital Management System</p>

            <div class="alert alert-success" th:if="${param.registered}">Registration successful. Please log in.</div>
            <div class="alert alert-info" th:if="${param.logout}">You have been logged out.</div>
            <div class="alert alert-danger" th:if="${param.error}">Invalid username or password.</div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="admin" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="admin123" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign in</button>
            </form>

            <p class="text-center mt-3 mb-0">New patient? <a th:href="@{/register}">Register here</a></p>

            <hr class="my-4">
            <p class="small text-muted mb-2 fw-bold">Demo accounts</p>
            <ul class="small text-muted mb-0">
                <li><b>admin</b> / admin123 &rarr; Administrator</li>
                <li><b>doctor</b> / doctor123 &rarr; Doctor</li>
                <li><b>patient</b> / patient123 &rarr; Patient</li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
