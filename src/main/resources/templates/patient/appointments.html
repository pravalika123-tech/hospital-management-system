<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>My Appointments</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container py-4">
    <div class="alert alert-success" th:if="${param.booked}">Your appointment request was sent for approval.</div>
    <h2 class="fw-bold mb-4">My Appointments</h2>
    <div class="card"><table class="table table-hover mb-0">
        <thead class="table-light"><tr><th>Doctor</th><th>Date &amp; time</th><th>Reason</th><th>Status</th></tr></thead>
        <tbody>
        <tr th:each="a : ${appointments}">
            <td th:text="${a.doctorName}"></td><td th:text="${a.dateTime}"></td>
            <td th:text="${a.reason}"></td>
            <td><span class="badge bg-info text-dark" th:text="${a.status}"></span></td>
        </tr>
        <tr th:if="${#lists.isEmpty(appointments)}"><td colspan="4" class="text-muted">No appointments yet.</td></tr>
        </tbody>
    </table></div>
    <a th:href="@{/patient/book}" class="btn btn-primary mt-3">Book another</a>
    <a th:href="@{/patient/dashboard}" class="btn btn-link mt-3">&larr; Back to dashboard</a>
</div>
</body>
</html>
