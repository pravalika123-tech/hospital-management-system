<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Book Appointment</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container py-4" style="max-width: 640px;">
    <h2 class="fw-bold mb-4">Book an Appointment</h2>
    <div class="card"><div class="card-body">
        <form th:action="@{/patient/book}" method="post">
            <div class="mb-3">
                <label class="form-label">Doctor</label>
                <select name="doctorId" class="form-select" required>
                    <option value="">-- Select doctor --</option>
                    <option th:each="d : ${doctors}" th:value="${d.id}"
                            th:text="${d.name} + ' - ' + ${d.specialization}"></option>
                </select>
            </div>
            <div class="mb-3"><label class="form-label">Date &amp; time</label><input type="datetime-local" name="dateTime" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Reason for visit</label><textarea name="reason" class="form-control" rows="3" required></textarea></div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Request appointment</button>
                <a th:href="@{/patient/dashboard}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div></div>
</div>
</body>
</html>
