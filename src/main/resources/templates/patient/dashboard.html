<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Patient Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container py-4">
    <h2 class="fw-bold">Hello, <span th:text="${patient.name}">Patient</span></h2>
    <p class="text-muted">Manage your appointments and health records in one place.</p>
    <div class="d-flex gap-2 mb-4">
        <a th:href="@{/patient/book}" class="btn btn-primary">Book an appointment</a>
        <a th:href="@{/patient/appointments}" class="btn btn-outline-primary">My appointments</a>
        <a th:href="@{/patient/records}" class="btn btn-outline-primary">My records</a>
    </div>
    <div class="card mb-4">
        <div class="card-header fw-bold">Upcoming appointments</div>
        <div class="card-body"><table class="table table-sm mb-0">
            <thead><tr><th>Doctor</th><th>Date &amp; time</th><th>Reason</th><th>Status</th></tr></thead>
            <tbody>
            <tr th:each="a : ${appointments}">
                <td th:text="${a.doctorName}"></td><td th:text="${a.dateTime}"></td>
                <td th:text="${a.reason}"></td><td th:text="${a.status}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(appointments)}"><td colspan="4" class="text-muted">No appointments yet.</td></tr>
            </tbody>
        </table></div>
    </div>
    <div class="card">
        <div class="card-header fw-bold">Recent medical records</div>
        <div class="card-body"><table class="table table-sm mb-0">
            <thead><tr><th>Date</th><th>Doctor</th><th>Diagnosis</th><th>Prescription</th></tr></thead>
            <tbody>
            <tr th:each="r : ${records}">
                <td th:text="${r.date}"></td><td th:text="${r.doctorName}"></td>
                <td th:text="${r.diagnosis}"></td><td th:text="${r.prescription}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(records)}"><td colspan="4" class="text-muted">No records yet.</td></tr>
            </tbody>
        </table></div>
    </div>
</div>
</body>
</html>
