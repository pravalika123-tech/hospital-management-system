<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>My Medical Records</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container py-4">
    <h2 class="fw-bold mb-4">My Medical Records</h2>
    <div class="card"><table class="table table-hover mb-0">
        <thead class="table-light"><tr><th>Date</th><th>Doctor</th><th>Diagnosis</th><th>Prescription</th><th>Notes</th></tr></thead>
        <tbody>
        <tr th:each="r : ${records}">
            <td th:text="${r.date}"></td><td th:text="${r.doctorName}"></td>
            <td th:text="${r.diagnosis}"></td><td th:text="${r.prescription}"></td><td th:text="${r.notes}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(records)}"><td colspan="5" class="text-muted">No records yet.</td></tr>
        </tbody>
    </table></div>
    <a th:href="@{/patient/dashboard}" class="btn btn-link mt-3">&larr; Back to dashboard</a>
</div>
</body>
</html>
