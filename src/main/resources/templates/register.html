<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - CarePlus Hospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 640px;">
    <div class="card shadow-sm mt-5">
        <div class="card-body p-4">
            <h3 class="text-primary fw-bold">Patient Registration</h3>
            <p class="text-muted small">Create your patient account. Your phone number is used as the initial password.</p>
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/register}" th:object="${patient}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Full name</label>
                        <input class="form-control" th:field="*{name}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" th:field="*{email}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Phone</label>
                        <input class="form-control" th:field="*{phone}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Date of birth</label>
                        <input type="date" class="form-control" th:field="*{dateOfBirth}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Username</label>
                        <input class="form-control" th:field="*{username}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Address</label>
                        <input class="form-control" th:field="*{address}">
                    </div>
                </div>
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary">Create account</button>
                </div>
            </form>
            <p class="text-center mt-3 mb-0"><a th:href="@{/login}">Back to login</a></p>
        </div>
    </div>
</div>
</body>
</html>
